name: frontend
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.10.4

dependencies:
  crystal_navigation_bar: ^1.1.0
  flutter:
    sdk: flutter
  flutter_animate: ^4.5.2
  http: ^1.6.0
  iconly: ^1.0.1
  shared_preferences: ^2.5.4
  geolocator: ^10.1.0
  geocoding: ^2.2.0
  image_picker: ^1.2.1
  video_player: ^2.10.1
  google_nav_bar: ^5.0.7
  intl: ^0.20.2
  url_launcher: ^6.3.2
  

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/app_icon.jpeg"


flutter:
  uses-material-design: true
  assets:
    - assets/
